name: Package GitHub Ready ZIP

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean upload package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="DiversifedPlus-github-ready"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          rsync -a ./ "$ROOT"/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude "$ROOT/" \
            --exclude '*.zip' \
            --exclude '.DS_Store'
          touch "$ROOT/.nojekyll"
          cat > "$ROOT/GITHUB-UPLOAD-INSTRUCTIONS.txt" <<'EOF'
          DIVERSIFIED PLUS — GITHUB-READY WEBSITE PACKAGE

          1. Extract this ZIP before uploading through GitHub's web interface.
          2. Upload the CONTENTS of the DiversifedPlus-github-ready folder to the repository root.
          3. Keep index.html and the assets folder at the repository root.
          4. GitHub Pages settings: main branch, / (root).
          5. The included .nojekyll file prevents GitHub Pages from ignoring asset folders.
          EOF
          test -f "$ROOT/index.html"
          test -d "$ROOT/assets"
          find "$ROOT" -type f | sort > "$ROOT/PACKAGE-FILE-LIST.txt"

      - name: Upload clean package
        uses: actions/upload-artifact@v4
        with:
          name: DiversifedPlus-github-ready
          path: DiversifedPlus-github-ready
          include-hidden-files: true
          compression-level: 6
          retention-days: 7
